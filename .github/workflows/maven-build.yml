name: CrissCross JavaFX Build & Verification

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Compile & Run Verification Tests
        run: .\mvnw.cmd clean test-compile

      - name: Package Application JAR
        run: .\mvnw.cmd package -DskipTests

      - name: Upload Packaged Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: CrissCross-Smart-Parking-Build
          path: target/*.jar
