<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>VIT Vellore Live Campus Parking Map</title>
  <link rel="stylesheet" href="../leaflet/leaflet.css" />
  <script src="../leaflet/leaflet.js"></script>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    html, body, #map {
      width: 100%;
      height: 100%;
      background: #070d1e;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      overflow: hidden;
    }

    /* Glassmorphic Map Controls & Popups */
    .leaflet-popup-content-wrapper {
      background: rgba(15, 23, 42, 0.94);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border-radius: 18px;
      border: 1.5px solid rgba(56, 189, 248, 0.35);
      box-shadow: 0 16px 36px rgba(0, 0, 0, 0.55), 0 0 20px rgba(56, 189, 248, 0.15);
      color: #f1f5f9;
      padding: 2px;
    }
    .leaflet-popup-tip {
      background: rgba(15, 23, 42, 0.94);
      border: 1.5px solid rgba(56, 189, 248, 0.35);
      box-shadow: none;
    }
    .leaflet-popup-content {
      margin: 14px 16px;
      line-height: 1.4;
    }

    /* Custom Parking Marker Styling */
    .parking-marker-container {
      cursor: pointer;
      display: flex;
      flex-direction: column;
      align-items: center;
      transition: transform 0.2s cubic-bezier(0.34, 1.56, 0.64, 1);
    }
    .parking-marker-container:hover {
      transform: scale(1.12);
    }
    .parking-marker-pill {
      display: flex;
      align-items: center;
      gap: 6px;
      padding: 5px 10px;
      border-radius: 20px;
      font-weight: 800;
      font-size: 11px;
      color: #ffffff;
      box-shadow: 0 6px 18px rgba(0, 0, 0, 0.25);
      border: 2px solid #ffffff;
      white-space: nowrap;
    }
    .parking-badge-p {
      background: rgba(255, 255, 255, 0.25);
      padding: 1px 6px;
      border-radius: 6px;
      font-size: 11px;
      font-weight: 900;
    }
    .parking-marker-pointer {
      width: 0;
      height: 0;
      border-left: 6px solid transparent;
      border-right: 6px solid transparent;
      border-top: 8px solid;
      margin-top: -1px;
    }

    /* Specific zone colors */
    .zone-sjt .parking-marker-pill {
      background: linear-gradient(135deg, #0284c7, #2563eb);
    }
    .zone-sjt .parking-marker-pointer {
      border-top-color: #2563eb;
    }

    .zone-cdmm .parking-marker-pill {
      background: linear-gradient(135deg, #6366f1, #8b5cf6);
    }
    .zone-cdmm .parking-marker-pointer {
      border-top-color: #8b5cf6;
    }

    .zone-woodys .parking-marker-pill {
      background: linear-gradient(135deg, #059669, #10b981);
    }
    .zone-woodys .parking-marker-pointer {
      border-top-color: #10b981;
    }

    /* Landmark Venue Marker */
    .venue-marker {
      background: rgba(255, 255, 255, 0.92);
      border: 2px solid #f59e0b;
      border-radius: 12px;
      padding: 4px 8px;
      font-size: 10px;
      font-weight: 700;
      color: #78350f;
      display: flex;
      align-items: center;
      gap: 4px;
      box-shadow: 0 4px 12px rgba(245, 158, 11, 0.25);
      white-space: nowrap;
    }
    .venue-active-star {
      animation: pulse-star 1.8s infinite;
      border-color: #f59e0b;
      background: #fef3c7;
      box-shadow: 0 0 16px rgba(245, 158, 11, 0.7);
    }
    @keyframes pulse-star {
      0% { transform: scale(1); }
      50% { transform: scale(1.08); }
      100% { transform: scale(1); }
    }

    /* Custom Destination Pin */
    .dest-pin {
      width: 22px;
      height: 22px;
      background: #f43f5e;
      border: 3px solid #ffffff;
      border-radius: 50% 50% 50% 0;
      transform: rotate(-45deg);
      box-shadow: 0 4px 14px rgba(244, 63, 94, 0.5);
      position: relative;
    }
    .dest-pin::after {
      content: '';
      position: absolute;
      width: 7px;
      height: 7px;
      background: white;
      border-radius: 50%;
      top: 5px;
      left: 5px;
    }

    /* Popup content styling */
    .popup-title {
      font-size: 15px;
      font-weight: 800;
      color: #ffffff;
      margin-bottom: 2px;
    }
    .popup-sub {
      font-size: 11px;
      color: #94a3b8;
      margin-bottom: 8px;
    }
    .popup-badge {
      display: inline-block;
      background: rgba(34, 197, 94, 0.18);
      color: #4ade80;
      font-weight: 700;
      font-size: 11px;
      padding: 3px 8px;
      border-radius: 8px;
      border: 1px solid rgba(34, 197, 94, 0.4);
      margin-bottom: 10px;
    }
    .popup-select-btn {
      display: block;
      width: 100%;
      background: linear-gradient(135deg, #0284c7, #2563eb);
      color: #ffffff;
      font-weight: 700;
      font-size: 12px;
      text-align: center;
      padding: 8px 14px;
      border-radius: 10px;
      border: none;
      cursor: pointer;
      text-decoration: none;
      box-shadow: 0 4px 12px rgba(2, 132, 199, 0.35);
      transition: background 0.15s ease;
    }
    .popup-select-btn:hover {
      background: linear-gradient(135deg, #0369a1, #1d4ed8);
    }

    /* Floating Legend Badge */
    .map-badge-legend {
      position: absolute;
      bottom: 12px;
      left: 12px;
      z-index: 1000;
      background: rgba(15, 23, 42, 0.88);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      padding: 6px 12px;
      border-radius: 12px;
      border: 1px solid rgba(56, 189, 248, 0.35);
      box-shadow: 0 6px 16px rgba(0, 0, 0, 0.4);
      font-size: 11px;
      color: #38bdf8;
      font-weight: 600;
      display: flex;
      align-items: center;
      gap: 6px;
      pointer-events: none;
    }
    .legend-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #10b981;
      box-shadow: 0 0 6px #10b981;
    }
  </style>
</head>
<body>
  <div id="map"></div>
  <div class="map-badge-legend">
    <div class="legend-dot"></div>
    <span>Live Geographic Tiles • VIT Vellore Campus</span>
  </div>

  <script>
    // --- VIT VELLORE GEOGRAPHIC COORDINATES ---
    const VIT_CENTER = [12.9692, 79.1559];
    const DEFAULT_ZOOM = 16;

    // Designated Event Parking Lots
    const PARKING_AREAS = [
      {
        code: "SJT",
        name: "SJT Parking Area",
        lat: 12.9712,
        lng: 79.1638,
        zoneClass: "zone-sjt",
        color: "#0284c7",
        total: 30,
        avail: 24,
        venue: "SJT Auditorium",
        walkMins: 1,
        desc: "Adjacent to Silver Jubilee Tower (North Quad)"
      },
      {
        code: "CDMM",
        name: "CDMM Parking Area",
        lat: 12.9698,
        lng: 79.1565,
        zoneClass: "zone-cdmm",
        color: "#6366f1",
        total: 30,
        avail: 26,
        venue: "CDMM Hall & Design Quad",
        walkMins: 2,
        desc: "Behind CDMM Architecture Block (Central Campus)"
      },
      {
        code: "WOODYS",
        name: "Woody's Arena Parking",
        lat: 12.9664,
        lng: 79.1552,
        zoneClass: "zone-woodys",
        color: "#10b981",
        total: 30,
        avail: 27,
        venue: "Woody's Grounds & Sports Stadium",
        walkMins: 1,
        desc: "Outdoor Stadium & Food Street (South Campus)"
      }
    ];

    // Key Campus Venues
    const CAMPUS_LANDMARKS = [
      { name: "Silver Jubilee Tower (SJT)", lat: 12.9718, lng: 79.1635, icon: "🏢" },
      { name: "Technology Tower (TT)", lat: 12.9702, lng: 79.1594, icon: "🔬" },
      { name: "CDMM Architecture Block", lat: 12.9701, lng: 79.1568, icon: "📐" },
      { name: "Anna Auditorium & Main Bldg", lat: 12.9688, lng: 79.1558, icon: "🏛️" },
      { name: "Woody's Sports Arena & 400m Track", lat: 12.9660, lng: 79.1548, icon: "⚽" },
      { name: "VIT Main Gate & Bus Terminal", lat: 12.9682, lng: 79.1534, icon: "🚪" }
    ];

    // --- INITIALIZE LEAFLET MAP ---
    const map = L.map('map', {
      center: VIT_CENTER,
      zoom: DEFAULT_ZOOM,
      minZoom: 14,
      maxZoom: 19,
      zoomControl: true
    });

    // --- TILE LAYERS ---
    // 1. CartoDB Voyager (Modern clean glass-compatible style)
    const voyagerLayer = L.tileLayer('https://{s}.basemaps.cartocdn.com/rastertiles/voyager/{z}/{x}/{y}{r}.png', {
      maxZoom: 19,
      subdomains: 'abcd',
      attribution: '&copy; OpenStreetMap contributors &copy; CARTO'
    });

    // 2. OpenStreetMap Standard
    const osmLayer = L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png', {
      maxZoom: 19,
      attribution: '&copy; OpenStreetMap contributors'
    });

    // 3. Esri Satellite Imagery
    const satelliteLayer = L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}', {
      maxZoom: 19,
      attribution: '&copy; Esri World Imagery'
    });

    // Default to Carto Voyager
    voyagerLayer.addTo(map);
    let currentLayer = voyagerLayer;

    // --- MARKERS STORAGE ---
    const parkingMarkers = {};
    let pinMarker = null;
    let walkRouteLine = null;
    let activeEventVenueMarker = null;

    // --- RENDER PARKING LOT MARKERS ---
    PARKING_AREAS.forEach(area => {
      const customIcon = L.divIcon({
        className: `parking-marker-container ${area.zoneClass}`,
        html: `
          <div class="parking-marker-pill">
            <span class="parking-badge-p">P</span>
            <span id="badge-text-${area.code}">${area.code} (${area.avail}/${area.total})</span>
          </div>
          <div class="parking-marker-pointer"></div>
        `,
        iconSize: [120, 36],
        iconAnchor: [60, 36],
        popupAnchor: [0, -36]
      });

      const marker = L.marker([area.lat, area.lng], { icon: customIcon }).addTo(map);

      const popupContent = `
        <div class="popup-title">${area.name}</div>
        <div class="popup-sub">${area.desc}</div>
        <div class="popup-badge" id="popup-badge-${area.code}">● ${area.avail} of ${area.total} Slots Free</div>
        <div style="font-size: 11px; color: #0284c7; margin-bottom: 8px;">📍 Nearest: ${area.venue} (${area.walkMins} min walk)</div>
        <button class="popup-select-btn" onclick="selectParkingLot('${area.code}')">Select ${area.code} & Pick Slot →</button>
      `;

      marker.bindPopup(popupContent);

      marker.on('click', () => {
        selectParkingLot(area.code);
      });

      parkingMarkers[area.code] = marker;
    });

    // --- RENDER CAMPUS VENUES ---
    CAMPUS_LANDMARKS.forEach(landmark => {
      const landmarkIcon = L.divIcon({
        className: 'venue-marker-container',
        html: `<div class="venue-marker" id="landmark-${landmark.name.substring(0, 4)}">${landmark.icon} ${landmark.name}</div>`,
        iconSize: [150, 24],
        iconAnchor: [75, 12]
      });

      L.marker([landmark.lat, landmark.lng], { icon: landmarkIcon }).addTo(map)
        .bindTooltip(`<b>${landmark.name}</b><br>VIT Vellore Campus Venue`, { direction: 'top' });
    });

    // --- CLICK ANYWHERE TO DROP PIN & MEASURE WALKING DISTANCE ---
    map.on('click', function(e) {
      dropCustomPin(e.latlng.lat, e.latlng.lng);
    });

    function dropCustomPin(lat, lng) {
      if (pinMarker) {
        map.removeLayer(pinMarker);
      }
      if (walkRouteLine) {
        map.removeLayer(walkRouteLine);
      }

      // Compute nearest parking lot using Haversine formula
      let nearest = null;
      let minDistance = Infinity;

      PARKING_AREAS.forEach(area => {
        const d = haversineDistance(lat, lng, area.lat, area.lng);
        if (d < minDistance) {
          minDistance = d;
          nearest = area;
        }
      });

      const distanceMeters = Math.round(minDistance);
      const walkMins = Math.max(1, Math.round(distanceMeters / 65)); // ~65m per min walking speed

      // Custom Pin Icon
      const pinIcon = L.divIcon({
        className: 'dest-pin-container',
        html: `<div class="dest-pin"></div>`,
        iconSize: [22, 22],
        iconAnchor: [11, 22],
        popupAnchor: [0, -22]
      });

      pinMarker = L.marker([lat, lng], { icon: pinIcon }).addTo(map);

      // Dashed Walking Line to Nearest Parking Lot
      walkRouteLine = L.polyline([[lat, lng], [nearest.lat, nearest.lng]], {
        color: '#f59e0b',
        weight: 3,
        dashArray: '6, 6',
        opacity: 0.9
      }).addTo(map);

      // Popup on pin
      const pinPopup = `
        <div class="popup-title">📍 Selected Campus Destination</div>
        <div class="popup-sub">Real-Time Distance Calculation</div>
        <div style="font-size: 12px; font-weight: 700; color: #0284c7; margin-bottom: 6px;">
          🚶 ~${distanceMeters}m (${walkMins} min walk) to <b>${nearest.code} PARKING</b>
        </div>
        <button class="popup-select-btn" onclick="selectParkingLot('${nearest.code}')">Select ${nearest.code} Parking →</button>
      `;

      pinMarker.bindPopup(pinPopup).openPopup();

      // Notify Java Bridge
      if (window.javaBridge && window.javaBridge.onPinDropped) {
        window.javaBridge.onPinDropped(lat, lng, distanceMeters, walkMins, nearest.code);
      }
    }

    // --- HAVERSINE DISTANCE IN METERS ---
    function haversineDistance(lat1, lon1, lat2, lon2) {
      const R = 6371000; // Earth radius in meters
      const toRad = Math.PI / 180;
      const dLat = (lat2 - lat1) * toRad;
      const dLon = (lon2 - lon1) * toRad;
      const a = Math.sin(dLat / 2) * Math.sin(dLat / 2) +
                Math.cos(lat1 * toRad) * Math.cos(lat2 * toRad) *
                Math.sin(dLon / 2) * Math.sin(dLon / 2);
      const c = 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1 - a));
      return R * c;
    }

    // --- ACTIONS TRIGGERED FROM JAVASCRIPT OR JAVA ---
    function selectParkingLot(code) {
      const area = PARKING_AREAS.find(a => a.code.toUpperCase() === code.toUpperCase());
      if (!area) return;

      const marker = parkingMarkers[area.code];
      if (marker) {
        marker.openPopup();
        map.panTo([area.lat, area.lng], { animate: true, duration: 0.8 });
      }

      // Call Java Application Bridge
      if (window.javaBridge && window.javaBridge.onParkingSelected) {
        window.javaBridge.onParkingSelected(area.code);
      }
    }

    // --- PUBLIC METHODS EXPOSED TO JAVAFX WEBENGINE ---
    window.focusArea = function(code) {
      const area = PARKING_AREAS.find(a => a.code.toUpperCase() === code.toUpperCase());
      if (area) {
        map.setView([area.lat, area.lng], 17, { animate: true });
        if (parkingMarkers[area.code]) {
          parkingMarkers[area.code].openPopup();
        }
      }
    };

    window.resetCampusView = function() {
      map.setView(VIT_CENTER, DEFAULT_ZOOM, { animate: true });
    };

    window.setTileLayer = function(layerType) {
      map.removeLayer(currentLayer);
      if (layerType === 'satellite') {
        currentLayer = satelliteLayer;
      } else if (layerType === 'osm') {
        currentLayer = osmLayer;
      } else {
        currentLayer = voyagerLayer;
      }
      currentLayer.addTo(map);
    };

    window.updateSlotCapacity = function(code, avail, total) {
      const textEl = document.getElementById(`badge-text-${code}`);
      if (textEl) {
        textEl.textContent = `${code} (${avail}/${total})`;
      }
      const popupEl = document.getElementById(`popup-badge-${code}`);
      if (popupEl) {
        popupEl.textContent = `● ${avail} of ${total} Slots Free`;
      }
    };

    window.highlightEventVenue = function(venueKeyword) {
      if (!venueKeyword) return;
      const lower = venueKeyword.toLowerCase();
      CAMPUS_LANDMARKS.forEach(l => {
        if (l.name.toLowerCase().includes(lower)) {
          const el = document.getElementById(`landmark-${l.name.substring(0, 4)}`);
          if (el) {
            el.classList.add('venue-active-star');
            el.innerHTML = `★ ${l.icon} ACTIVE VENUE: ${l.name}`;
          }
        }
      });
    };

    // Notify Java Bridge that map has loaded
    window.addEventListener('load', function() {
      setTimeout(() => {
        map.invalidateSize();
        if (window.javaBridge && window.javaBridge.onMapReady) {
          window.javaBridge.onMapReady();
        }
      }, 300);
    });
  </script>
</body>
</html>
